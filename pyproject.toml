[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ceats-intel"
version = "0.1.0"
description = "Microservicio de recomendaciones y analitica para cEats"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
# El dominio no necesita nada. Las dependencias de red entran hasta la Unidad 4.
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# UP042 pide StrEnum. Me quedo con (str, Enum): es lo que serializa igual
# en Pydantic v2 y en el JSON del contrato, y no quiero que un cambio de
# base mueva la forma de la respuesta.
ignore = ["UP042"]
